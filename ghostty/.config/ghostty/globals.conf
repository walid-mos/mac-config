# === Clipboard & Selection ===
clipboard-read = allow
clipboard-write = allow
copy-on-select = false
selection-clear-on-typing = true

# === Session ===
# Lance herdr directement : ghostty n'est qu'un hôte, tout le multiplexing vit
# dans herdr. Chemin absolu car une app GUI macOS n'hérite pas du PATH du shell.
command = /opt/homebrew/bin/herdr

# Une app GUI macOS démarre avec le PATH launchd minimal (/usr/bin:/bin:...).
# Sans ça, le serveur herdr ne trouve pas terminal-notifier et ses notifications
# système retombent sur osascript (attribuées à « Script Editor », clic inutile).
# Supporté par Ghostty >= 1.2.0 ; chemins absolus, pas d'expansion $PATH.
env = PATH=/opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin

# === macOS Integration ===
# left = option gauche envoie Alt (alt+hjkl -> herdr) ; option droite garde la
# composition de caractères. Requis pour que les bindings alt+... atteignent herdr.
macos-option-as-alt = left
macos-titlebar-style = transparent

# === Window Configuration ===
window-height = 70
window-width = 320
window-padding-x = 5
window-padding-y = 2
window-save-state = always

# === Shell Integration ===
window-inherit-working-directory = true
shell-integration = detect
# ssh-env/ssh-terminfo désactivés : l'install auto casse dès qu'il y a une commande
# distante (ghostty concatène la commande au script d'install → tic ne s'exécute jamais,
# cf. studio-unlock → error.InstallFailed). Le terminfo xterm-ghostty est installé une
# fois sur les hôtes (~/.terminfo) ; ssh transmet TERM=xterm-ghostty nativement.
shell-integration-features = no-ssh-env,no-ssh-terminfo

# === URL & Links ===
link-url = true
link-previews = true

# === Mouse Behavior ===
mouse-shift-capture = false
mouse-hide-while-typing = true
right-click-action = paste

# === Native Splits ===
unfocused-split-opacity = 0.8
unfocused-split-fill = #888888
split-divider-color = #808080

# === Quick Terminal ===
quick-terminal-size = 30%,85%

# === Notifications ===
desktop-notifications = true

# === Performance ===
background-opacity-cells = true

# === Updates ===
auto-update-channel = tip