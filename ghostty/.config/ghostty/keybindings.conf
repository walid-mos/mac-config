# === Clipboard ===
# Explicit copy/paste — prevents super+c from falling through
# to the app as raw "c" when there's no terminal selection
keybind = super+c=copy_to_clipboard
keybind = super+v=paste_from_clipboard

# === Text Manipulation ===
keybind = shift+enter=text:\x1b\r
keybind = super+backspace=text:\x15
keybind = option+backspace=text:\x17

# === Word Navigation ===
keybind = option+left=unbind
keybind = option+right=unbind
keybind = option+left=text:\x1bb
keybind = option+right=text:\x1bf

# === Tab Navigation ===
keybind = option+left_bracket=previous_tab
keybind = option+right_bracket=next_tab

# === Split Creation ===
keybind = option+n=new_split:right
keybind = option+v=new_split:down

# === Split Navigation ===
# performable: only intercepts if a split exists in that direction,
# otherwise passes through to the child process (e.g. Neovim)
keybind = performable:option+h=goto_split:left
keybind = performable:option+j=goto_split:down
keybind = performable:option+k=goto_split:up
keybind = performable:option+l=goto_split:right

# === Split Management ===
keybind = option+x=close_surface
keybind = option+q=inspector:toggle

# === Split Resizing ===
keybind = option+shift+h=resize_split:left,10
keybind = option+shift+j=resize_split:down,5
keybind = option+shift+k=resize_split:up,5
keybind = option+shift+l=resize_split:right,10

# === Quick Terminal ===
keybind = ctrl+a>d=toggle_quick_terminal

# === Command Palette (2025) ===
keybind = super+shift+p=toggle_command_palette
