<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swarm Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-900 text-white font-sans">
    <section class="min-h-screen flex flex-col items-center justify-center text-center px-4">
      <h1 class="text-3xl md:text-5xl font-bold mb-4">Welcome to Swarm Test</h1>
      <p class="text-lg md:text-xl text-gray-300 mb-8">This page was built by the swarm pipeline.</p>
      <a
        href="#features"
        class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-lg transition-colors"
      >
        Get Started
      </a>
    </section>

    <section id="features" class="py-20 px-4 bg-gray-900">
      <h2 class="text-3xl md:text-4xl font-bold text-center mb-12">Features</h2>
      <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
        <div class="bg-gray-800 rounded-lg p-6 text-center">
          <span class="text-4xl mb-4 block">🚀</span>
          <h3 class="text-xl font-semibold mb-2">Fast</h3>
          <p class="text-gray-300">Blazing fast build pipeline.</p>
        </div>
        <div class="bg-gray-800 rounded-lg p-6 text-center">
          <span class="text-4xl mb-4 block">⚡</span>
          <h3 class="text-xl font-semibold mb-2">Parallel</h3>
          <p class="text-gray-300">Agents work in parallel for maximum throughput.</p>
        </div>
        <div class="bg-gray-800 rounded-lg p-6 text-center">
          <span class="text-4xl mb-4 block">🛡️</span>
          <h3 class="text-xl font-semibold mb-2">Safe</h3>
          <p class="text-gray-300">Mandatory security review on every iteration.</p>
        </div>
      </div>
    </section>
  </body>
</html>
