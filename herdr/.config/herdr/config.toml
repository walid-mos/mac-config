onboarding = false

[ui.toast]
# Canal unique : l'extension Pi émet toujours une notification macOS avec son
# et clic vers la pane source. Aucun toast Herdr en parallèle.
delivery = "off"

[theme]
name = "catppuccin-latte"
auto_switch = false

[theme.custom]
# Tabs inactifs : bloc gris très clair (mantle Latte) au lieu du gris
# surface0 par défaut (#ccd0da). Remettre "#ccd0da" pour le rendu d'origine.
surface0 = "#e6e9ef"

[ui]
show_agent_labels_on_pane_borders = true
mouse_capture = true
accent = "#8839ef" # mauve Latte, aligné sur l'accent du thème pi
pane_gaps = false # dividers fins partagés au lieu de doubles bordures épaisses
pane_scrollbars = false # récupère la colonne réservée aux scrollbars
hide_tab_bar_when_single_tab = true

agent_panel_sort = "spaces"

# Pi/frontend-check emits screenshots through the Kitty graphics protocol.
# Herdr must own and repaint those placements instead of only reserving their cells.
[experimental]
kitty_graphics = true

[ui.sidebar.agents]
row_gap = 1 # respiration entre les entrées d'agents
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent", "state_text"],
]

[keys]
# Prefix pour les actions rares (resize, copy, detach, help). ctrl+space :
# ergonomique, zéro conflit shell (ctrl+a écraserait le début-de-ligne readline).
prefix = "ctrl+space"

# Toggle entre les 2 derniers panes focus (éditeur ↔ agent)
last_pane = "prefix+space"

# Deux couches de chiffres, tout en direct : ctrl = tabs (fréquent, combo le plus
# fiable), alt = workspaces. ctrl+t / alt+t = nouveau tab / nouveau workspace.
# Le prefix reste en second dans chaque array : fallback si un chord direct ne
# passe pas (ctrl+ponctuation dépend de la négo CSI-u ghostty↔herdr).
switch_tab = ["ctrl+1..9", "prefix+1..9"]
switch_workspace = ["alt+1..9", "prefix+shift+1..9"]
new_tab = ["ctrl+t", "prefix+c"]
next_tab = ["ctrl+]", "prefix+]"]
previous_tab = ["ctrl+[", "prefix+["]
new_workspace = ["alt+t", "prefix+shift+n"]
next_workspace = ["alt+]", "prefix+tab"]
previous_workspace = ["alt+[", "prefix+shift+tab"]
copy_mode = "prefix+shift+c"
cycle_pane_next = ""
cycle_pane_previous = ""

# Navigate mode (prefix+w) : hjkl = panes (persistant), JK = workspaces
navigate_workspace_up = "shift+k"
navigate_workspace_down = "shift+j"
navigate_pane_up = "k"
navigate_pane_down = "j"

# Splits directs, muscle memory ghostty (n = pane à droite, v = pane en bas).
# alt+... passe car ghostty a macos-option-as-alt = left.
split_vertical = "alt+n"
split_horizontal = "alt+v"
close_pane = "alt+x"
# Resize reste prefix+r (mode). Tabs = ctrl+chiffre, workspaces = alt+chiffre.

# Navigation vim-aware nvim <-> herdr via le plugin aimdevlee/herdr-nvim-nav.
# Reconstruit le performable de ghostty, que herdr n'a pas : herdr lit un marker
# de pane, forwarde la frappe au nvim par socket sinon déplace le focus de pane.
[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-nvim-nav.left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-nvim-nav.down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-nvim-nav.up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-nvim-nav.right"

# Le son est porté par l'unique notification macOS de pi-notify.
[ui.sound]
enabled = false
