# RTK — Rust Token Killer
# Compresse la sortie des commandes CLI avant qu'elle n'entre dans le contexte LLM
# (60-90 % de tokens en moins). Doc : https://github.com/rtk-ai/rtk
#
# Le binaire et le hook Claude Code sont posés par `make rtk` (cible rtk-post du
# Makefile : `brew install rtk` puis `rtk init -g`). Ce fichier ne versionne que
# la config ; les logs runtime vivent dans ~/.local/share/rtk/ (hors repo).

[hooks]
# Commandes dont RTK NE réécrit PAS la sortie (passées telles quelles).
# "lint" : rtk lint suppose ESLint et REMPLACE la commande par `rtk lint` —
# casse les projets oxlint (NextNode). Exclu tant que rtk ne détecte pas le linter.
exclude_commands = ["curl", "pnpm lint", "pnpm run lint", "npm run lint", "yarn lint", "turbo run lint"]

[tee]
enabled = true        # conserve la sortie brute en cas d'échec
mode = "failures"     # "failures" | "always" | "never"
max_files = 20        # requis depuis rtk 0.42 — sans lui le TOML ne parse plus
max_file_size = 1048576
