# =============================================================================
# Colima Default Template
# =============================================================================
# Applied to new profiles created via `colima start`.
# Per-profile overrides land in ~/.config/colima/<profile>/colima.yaml.
# Docs: https://github.com/abiosoft/colima/blob/main/docs/INDEX.md
# =============================================================================

# VM resources — conservative defaults for a 24/7 daemon.
# vz does memory ballooning, so these are *caps*, not reservations: an idle
# VM consumes ~200–500 MB. Bump on demand for heavy builds with
# `colima start --cpu 8 --memory 12`.
cpu: 4
memory: 8
disk: 60

# Apple Virtualization.framework — faster than QEMU on Apple Silicon.
# rosetta lets x86_64 images run via Rosetta 2 (macOS 13+).
vmType: vz
rosetta: true

# virtiofs is the fastest file-sharing backend for vz (inotify works natively)
mountType: virtiofs

# Docker runtime, auto-switch the docker context to colima on start
runtime: docker
autoActivate: true

# Network — reachable IP off (default; enabling needs sudo at every boot)
network:
  address: false
  dns: []

# dockerd configuration (merged into the VM's /etc/docker/daemon.json)
docker:
  features:
    buildkit: true
  # BuildKit garbage collection — keep the VM disk from filling up
  builder:
    gc:
      enabled: true
      defaultKeepStorage: "20GB"

# Kubernetes — disabled by default (use kind/k3d on top of docker if needed)
kubernetes:
  enabled: false
