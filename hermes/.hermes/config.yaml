plugins:
  enabled:
    - brain-reminders
    - bookmarks-readlist
  disabled:
    - browser/browser_use
    - browser/browserbase
    - browser/firecrawl
  entries:
    brain-reminders:
      allow_tool_override: false
desktop:
  auto_continue:
    enabled: false
_config_version: 39
custom_providers:
  - name: Gemma 4
    base_url: http://localhost:8080/v1
    model: mlx-community/gemma-4-12B-it-4bit
