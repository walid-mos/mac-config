# Ghostty n'est qu'un hôte pour herdr : tout le multiplexing (splits, tabs,
# workspaces, resize, navigation) vit dans herdr. Ne restent ici que les
# traductions de frappes au niveau terminal, qu'un multiplexer ne peut pas faire.

# === Clipboard ===
# Explicit copy/paste — prevents super+c from falling through
# to the app as raw "c" when there's no terminal selection
keybind = super+c=copy_to_clipboard
keybind = super+v=paste_from_clipboard

# === Text Manipulation ===
# Pi and Ghostty negotiate the Kitty keyboard protocol themselves. Do not remap
# Shift+Enter: a text: override can leak a modified Enter sequence through herdr.
keybind = super+backspace=text:\x15
keybind = option+backspace=text:\x17

# === Word Navigation ===
keybind = option+left=unbind
keybind = option+right=unbind
keybind = option+left=text:\x1bb
keybind = option+right=text:\x1bf

# === Windowing rendu à herdr ===
# Ghostty a ses propres tabs/splits, redondants avec herdr et qui captent la
# frappe avant lui (ex. super+[/] = goto_split, ctrl+tab = next_tab ghostty).
# On les neutralise pour que ces touches descendent à herdr, seul gestionnaire.
keybind = ctrl+tab=unbind
keybind = ctrl+shift+tab=unbind
keybind = super+[=unbind
keybind = super+]=unbind
keybind = super+shift+[=unbind
keybind = super+shift+]=unbind
keybind = super+t=unbind
keybind = super+d=unbind
keybind = super+shift+d=unbind
keybind = super+alt+w=unbind
keybind = super+shift+enter=unbind
keybind = super+alt+arrow_left=unbind
keybind = super+alt+arrow_right=unbind
keybind = super+alt+arrow_up=unbind
keybind = super+alt+arrow_down=unbind
keybind = super+ctrl+==unbind
keybind = super+ctrl+arrow_left=unbind
keybind = super+ctrl+arrow_right=unbind
keybind = super+ctrl+arrow_up=unbind
keybind = super+ctrl+arrow_down=unbind
