# Tmux configuration minimale pour remplacer Zellij
# Configuration simple et épurée

# Change prefix key to Ctrl-a (comme Zellij)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Keybinds personnalisés pour créer des panes
bind-key -n M-n split-window -h -c "#{pane_current_path}"  # Alt+n : split à droite
bind-key -n M-v split-window -v -c "#{pane_current_path}"  # Alt+v : split en bas

# Désactiver Alt+b pour éviter les conflits
unbind-key -n M-b

# Navigation avec vim-tmux-navigator (seamless avec nvim) - Alt+hjkl
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h'  'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j'  'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k'  'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l'  'select-pane -R'

bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-j' select-pane -D
bind-key -T copy-mode-vi 'M-k' select-pane -U
bind-key -T copy-mode-vi 'M-l' select-pane -R

# Fermer pane avec Alt+x (comme vous aviez dans Zellij)
bind-key -n M-x kill-pane

# Redimensionnement rapide
bind-key -n M-H resize-pane -L 5
bind-key -n M-J resize-pane -D 5
bind-key -n M-K resize-pane -U 5
bind-key -n M-L resize-pane -R 5

# Raccourci pour voir les numéros de panes (Alt+q)
bind-key -n M-q display-panes

# Configuration de base
set -g mouse on                    # Active la souris
set -g base-index 1               # Numérotation à partir de 1
set -g pane-base-index 1          # Idem pour les panes
set -g renumber-windows on        # Renumérote automatiquement

# Couleurs et style minimaliste
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Support pour les features avancées du terminal (mouse avec modificateurs)
set -as terminal-features ",*:RGB:mouse:xterm"
# Support des modificateurs de souris pour macOS/Ghostty
set -ga terminal-overrides ",*:Tc:Ms=\E]52;c;%p2%s\7"

# Status bar simple
set -g status-style bg=default
set -g status-left ""
set -g status-right "#[fg=gray]%H:%M"
set -g status-justify centre

# Style des panes - visibilité améliorée du pane actif
set -g pane-border-style fg=gray,dim
set -g pane-active-border-style fg=cyan,bold
set -g pane-border-lines heavy

# Headers avec numéros des panes (sans changer les backgrounds)
set -g pane-border-format " #{pane_index} "
set -g pane-border-status top

# Afficher les numéros de panes
set -g display-panes-time 2000
set -g display-panes-colour gray
set -g display-panes-active-colour cyan

# Indicateur visuel dans la status bar pour le pane actif
set -g window-status-current-style fg=cyan,bold,bg=default

# Reload config avec prefix+r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Pas de délai pour les touches escape (important pour nvim)
set -sg escape-time 0

# Historique plus grand
set -g history-limit 50000

# Copy mode vi
setw -g mode-keys vi